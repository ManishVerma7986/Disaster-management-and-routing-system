name: disaster_routing_mobile
description: Disaster-aware emergency routing client.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.0.3
  shared_preferences: ^2.3.3
  flutter_tts: ^4.2.3
  firebase_core: ^4.1.0
  firebase_messaging: ^16.0.1
  flutter_background_service: ^5.1.0

  cupertino_icons: ^1.0.8
  speech_to_text: ^7.5.0
  image_picker: ^1.2.3
  connectivity_plus: ^7.3.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
