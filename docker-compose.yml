services:
  postgres:
    image: postgis/postgis:16-3.4
    env_file:
    - ./backend/.env

    environment:
      POSTGRES_DB: disaster_routing
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - disaster-routing-db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  disaster-routing-db:
